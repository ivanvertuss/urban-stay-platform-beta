<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#061f34">
  <title>Urban Stay Platform · Administración · TEST</title>
  <link rel="stylesheet" href="styles/app.css">
  <link rel="stylesheet" href="styles/admin-test.css">
</head>
<body class="admin-body">
  <main class="admin-shell">
    <header class="admin-header">
      <div class="brand-wordmark"><span>URBAN STAY</span><b>PLATFORM</b></div>
      <div><span class="section-label">CONTROL URBAN STAY · TEST</span><h1>Administración de cuentas</h1><p>Aprueba o rechaza el acceso de nuevos propietarios.</p></div>
      <button class="btn secondary" id="adminLogout" hidden>Cerrar sesión</button>
    </header>
    <section class="admin-login card" id="adminLogin">
      <span class="section-label">ACCESO RESTRINGIDO</span>
      <h2>Acceso de administrador</h2>
      <p>Esta pantalla solo está disponible para cuentas Urban Stay con rol administrador.</p>
      <label>Correo electrónico<input id="adminEmail" type="email" autocomplete="email"></label>
      <label>Contraseña<input id="adminPassword" type="password" autocomplete="current-password"></label>
      <div class="form-message" id="adminMessage"></div>
      <button class="btn primary" id="adminLoginButton">Entrar</button>
    </section>
    <section id="adminConsole" hidden>
      <div class="admin-stats" id="adminStats"></div>
      <div class="admin-toolbar card"><div><span class="section-label">SOLICITUDES</span><h2>Usuarios registrados</h2></div><select id="accountFilter"><option value="pending">Pendientes</option><option value="approved">Aprobados</option><option value="rejected">Rechazados</option><option value="all">Todos</option></select></div>
      <div id="accountList" class="admin-list"></div>
    </section>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="scripts/supabase-config.js"></script>
  <script src="scripts/admin-test.js"></script>
</body>
</html>
