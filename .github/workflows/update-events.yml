name: Update Vigo events

on:
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-vigo-events
  cancel-in-progress: true

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch upcoming events
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          EVENT_CITY: Vigo
          EVENT_COUNTRY: ES
          EVENT_OUTPUT: data/events.json
        run: node scripts/update-events.mjs
      - name: Commit event data when changed
        run: |
          if git diff --quiet -- data/events.json; then
            echo "No event changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          git commit -m "Update Vigo events"
          git push
